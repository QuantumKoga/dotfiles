[general]
live_config_reload = true
import = [
    "~/.config/alacritty/colors.toml"
]

[scrolling]
history = 10000
multiplier = 3

[env]
TERM = "alacritty"

[keyboard]
bindings = [
  { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
]

[colors]
draw_bold_text_with_bright_colors = true
